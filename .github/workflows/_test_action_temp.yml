name: temp-test-merge-check-action
on: [workflow_dispatch]
jobs:
  trivial-clean-should-pass:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run readset action with into=HEAD (trivially clean)
        id: rs
        uses: ./
        with:
          into: HEAD
      - name: Assert it reported ok
        shell: bash
        run: |
          echo "action output ok=${{ steps.rs.outputs.ok }}"
          if [ "${{ steps.rs.outputs.ok }}" != "true" ]; then
            echo "FAIL: expected ok=true for into=HEAD (base == HEAD == into)"
            exit 1
          fi
          echo "PASS"

  bad-ref-should-fail-the-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run readset action against a target that does not exist
        id: rs
        continue-on-error: true
        uses: ./
        with:
          into: this-branch-does-not-exist-anywhere
      - name: Assert the action step itself failed
        shell: bash
        run: |
          echo "action step outcome=${{ steps.rs.outcome }}"
          if [ "${{ steps.rs.outcome }}" != "failure" ]; then
            echo "FAIL: expected the action step to fail on an unresolvable target ref"
            exit 1
          fi
          echo "PASS"

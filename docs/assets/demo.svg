    <svg id="screen" width="736" height="510" x="23" y="50" viewBox="0 0 736 510" preserveAspectRatio="xMidYMin slice"><rect class="background" height="100%" width="100%" x="0" y="0"/><defs><g id="g1"><text x="0" textLength="112" class="foreground">$ readset demo</text></g><g id="g2"><text x="0" textLength="8" class="background"> </text></g><g id="g3"><text x="0" textLength="352" font-weight="bold" class="foreground">readset demo: two agents, one file, no locks</text></g><g id="g4"><text x="0" textLength="216" class="color6">1. agent-a reads billing.py</text></g><g id="g5"><text x="0" textLength="216" class="color6">2. agent-b reads billing.py</text></g><g id="g6"><text x="0" textLength="336" class="color6">3. agent-b changes the tax rate and writes</text></g><g id="g7"><text x="0" textLength="536" class="color6">4. agent-a, still holding its old view, tries to write its refactor</text></g><g id="g8"><text x="0" textLength="616" class="foreground">   readset: write to billing.py blocked - the file changed after you read it.</text></g><g id="g9"><text x="0" textLength="24" class="foreground">   </text></g><g id="g10"><text x="0" textLength="224" class="foreground">   Changed by: agent-b (Fix)</text></g><g id="g11"><text x="0" textLength="264" class="foreground">   --- billing.py (what you read)</text></g><g id="g12"><text x="0" textLength="248" class="foreground">   +++ billing.py (on disk now)</text></g><g id="g13"><text x="0" textLength="144" class="foreground">   @@ -1,4 +1,4 @@</text></g><g id="g14"><text x="0" textLength="152" class="color1">   -TAX_RATE = 0.18</text></g><g id="g15"><text x="0" textLength="152" class="color2">   +TAX_RATE = 0.20</text></g><g id="g16"><text x="0" textLength="32" class="foreground">    </text></g><g id="g17"><text x="0" textLength="152" class="foreground">    def total(net):</text></g><g id="g18"><text x="0" textLength="696" class="foreground">   What to do: Read billing.py again, then retry your edit against the current content.</text></g><g id="g19"><text x="0" textLength="560" class="color6">5. agent-a re-reads billing.py and retries against the current content</text></g><g id="g20"><text x="0" textLength="384" class="color2">   write succeeded; both changes are in the file</text></g><g id="g21"><text x="0" textLength="544" class="foreground">Without readset, step 4 would have silently discarded agent-b's fix.</text></g></defs><g id="screen_view"><g><use xlink:href="#g1" y="0"/><rect x="0" y="17" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="17"/></g><g><use xlink:href="#g1" y="544"/><use xlink:href="#g3" y="561"/><rect x="0" y="578" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="578"/></g><g><use xlink:href="#g1" y="1088"/><use xlink:href="#g3" y="1105"/><rect x="0" y="1139" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="1139"/></g><g><use xlink:href="#g1" y="1632"/><use xlink:href="#g3" y="1649"/><use xlink:href="#g4" y="1683"/><rect x="0" y="1700" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="1700"/></g><g><use xlink:href="#g1" y="2176"/><use xlink:href="#g3" y="2193"/><use xlink:href="#g4" y="2227"/><use xlink:href="#g5" y="2244"/><rect x="0" y="2261" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="2261"/></g><g><use xlink:href="#g1" y="2720"/><use xlink:href="#g3" y="2737"/><use xlink:href="#g4" y="2771"/><use xlink:href="#g5" y="2788"/><use xlink:href="#g6" y="2805"/><rect x="0" y="2822" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="2822"/></g><g><use xlink:href="#g1" y="3264"/><use xlink:href="#g3" y="3281"/><use xlink:href="#g4" y="3315"/><use xlink:href="#g5" y="3332"/><use xlink:href="#g6" y="3349"/><use xlink:href="#g7" y="3366"/><rect x="0" y="3383" width="8" height="17" class="foreground"/><use xlink:href="#g2" y="3383"/></g><g><use xlink:href="#g1" y="3808"/><use xlink:href="#g3" y="3825"/><use xlink:href="#g4" y="3859"/><use xlink:href="#g5" y="3876"/><u